<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Track – Long Jump Meet Log</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    :root {
      --bg: #050608;
      --fg: #f5f5f5;
      --accent: #48c774;
      --muted: #888;
      --card: #111218;
      --radius: 8px;
      --pad: 0.75rem;
      --font: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body {
      margin: 0;
      font-family: var(--font);
      background: var(--bg);
      color: var(--fg);
      display: flex;
      min-height: 100vh;
      justify-content: center;
    }
    main {
      width: 100%;
      max-width: 720px;
      padding: 1.25rem;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 1rem;
    }
    h1 {
      font-size: 1.3rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 500;
    }
    .muted {
      color: var(--muted);
      font-size: 0.85rem;
    }
    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: var(--pad);
      margin-bottom: 1rem;
      border: 1px solid #1c1d24;
    }
    .row {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    .row > * {
      flex: 1 1 120px;
    }
    label {
      display: block;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 0.25rem;
      color: var(--muted);
    }
    input, select, textarea, button {
      font: inherit;
      border-radius: 999px;
      border: 1px solid #2b2d3a;
      background: #0b0c12;
      color: var(--fg);
      padding: 0.4rem 0.7rem;
    }
    textarea {
      resize: vertical;
      min-height: 2.5rem;
      border-radius: var(--radius);
    }
    button {
      border-radius: 999px;
      cursor: pointer;
      border-color: transparent;
      background: var(--accent);
      color: #050608;
      font-size: 0.9rem;
      padding-inline: 1rem;
      white-space: nowrap;
    }
    button.secondary {
      background: transparent;
      color: var(--muted);
      border-color: #2b2d3a;
    }
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
    }
    .attempt-list {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      margin-bottom: 0.5rem;
    }
    .attempt-row {
      display: grid;
      grid-template-columns: minmax(0, 70px) minmax(0, 1fr) minmax(0, 80px) minmax(0, 90px);
      gap: 0.5rem;
      align-items: center;
    }
    .attempt-cell span.muted {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      display: block;
      margin-bottom: 0.15rem;
    }
    .scratch-cell {
      display: flex;
      align-items: center;
      justify-content: flex-start;
    }
    .scratch-label {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      font-size: 0.8rem;
      color: var(--muted);
    }
    .scratch-label input[type="checkbox"] {
      width: auto;
      height: auto;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Track</h1>
        <div class="muted">Long jump meet log</div>
      </div>
    </header>

    <!-- Meet meta -->
    <section class="card">
      <div class="row">
        <div>
          <label for="meetName">Name</label>
          <input id="meetName" type="text" placeholder="Conference, Invite, etc.">
        </div>
        <div>
          <label for="location">Location</label>
          <input id="location" type="text" placeholder="School or venue">
        </div>
        <div>
          <label for="date">Date (M/D/Y)</label>
          <input id="date" type="text" placeholder="5/12/26">
        </div>
      </div>
    </section>

    <!-- Prelims attempts -->
    <section class="card">
      <div class="section-header">
        <span class="muted">Prelims</span>
      </div>
      <div id="prelimsList" class="attempt-list"></div>
      <button id="addPrelim" class="secondary">Add attempt</button>
    </section>

    <!-- Finals -->
    <section class="card">
      <div class="section-header">
        <span class="muted">Finals</span>
      </div>
      <div class="row" style="margin-bottom:0.5rem;">
        <div>
          <label for="finalsStatus">Finals status</label>
          <select id="finalsStatus">
            <option value="none">Meet had no finals</option>
            <option value="not-made">Didn’t make finals</option>
            <option value="made">Had finals</option>
          </select>
        </div>
      </div>
      <div id="finalsBlock" style="display:none;">
        <div id="finalsList" class="attempt-list"></div>
        <button id="addFinal" class="secondary">Add finals attempt</button>
      </div>
    </section>

    <!-- Result -->
    <section class="card">
      <div class="row">
        <div>
          <label for="place">Place</label>
          <input id="place" type="text" placeholder="e.g. 2nd">
        </div>
        <div>
          <label for="points">Points</label>
          <input id="points" type="number" min="0" placeholder="5">
          <label style="display:flex;align-items:center;gap:0.25rem;margin-top:0.25rem;">
            <input id="noPoints" type="checkbox">
            <span class="muted">None</span>
          </label>
        </div>
      </div>
    </section>
  </main>

  <script>
    const prelimsList = document.getElementById('prelimsList');
    const finalsList = document.getElementById('finalsList');
    const addPrelimBtn = document.getElementById('addPrelim');
    const addFinalBtn = document.getElementById('addFinal');
    const finalsStatusEl = document.getElementById('finalsStatus');
    const finalsBlock = document.getElementById('finalsBlock');
    const noPointsEl = document.getElementById('noPoints');
    const pointsEl = document.getElementById('points');

    let prelims = [];
    let finals = [];

    function makeAttemptRow(attempt) {
      const wrapper = document.createElement('div');
      wrapper.className = 'attempt-row';
      wrapper.innerHTML = `
        <div class="attempt-cell">
          <span class="muted">Attempt</span>
          <span>${attempt.index}</span>
        </div>
        <div>
          <label>Distance</label>
          <input type="number" step="0.01" value="${attempt.distance ?? ''}">
        </div>
        <div>
          <label>Unit</label>
          <select>
            <option value="m"${attempt.unit === 'm' ? ' selected' : ''}>m</option>
            <option value="ft"${attempt.unit === 'ft' ? ' selected' : ''}>ft</option>
          </select>
        </div>
        <div class="scratch-cell">
          <label class="scratch-label">
            <input type="checkbox"${attempt.scratch ? ' checked' : ''}>
            <span>Scratch</span>
          </label>
        </div>
      `;

      const distInput = wrapper.querySelector('input[type="number"]');
      const unitSelect = wrapper.querySelector('select');
      const scratchInput = wrapper.querySelector('input[type="checkbox"]');

      distInput.addEventListener('input', () => {
        attempt.distance = distInput.value ? parseFloat(distInput.value) : null;
      });
      unitSelect.addEventListener('change', () => {
        attempt.unit = unitSelect.value;
      });
      scratchInput.addEventListener('change', () => {
        attempt.scratch = scratchInput.checked;
      });

      return wrapper;
    }

    function renderAttempts() {
      prelimsList.innerHTML = '';
      prelims.forEach(a => prelimsList.appendChild(makeAttemptRow(a)));

      finalsList.innerHTML = '';
      finals.forEach(a => finalsList.appendChild(makeAttemptRow(a)));
    }

    function addAttempt(scope) {
      const list = scope === 'prelims' ? prelims : finals;
      const nextIndex = list.length + 1;
      list.push({
        index: nextIndex,
        distance: null,
        unit: 'm',
        scratch: false
      });
      renderAttempts();
    }

    addPrelimBtn.addEventListener('click', () => addAttempt('prelims'));
    addFinalBtn.addEventListener('click', () => addAttempt('finals'));

    finalsStatusEl.addEventListener('change', () => {
      const val = finalsStatusEl.value;
      finalsBlock.style.display = val === 'made' ? 'block' : 'none';
    });

    noPointsEl.addEventListener('change', () => {
      if (noPointsEl.checked) {
        pointsEl.value = '';
        pointsEl.disabled = true;
      } else {
        pointsEl.disabled = false;
      }
    });

    // initial 3 + 3 attempts
    for (let i = 0; i < 3; i++) addAttempt('prelims');
    for (let i = 0; i < 3; i++) addAttempt('finals');
    finalsBlock.style.display = 'none';
  </script>
</body>
</html>
